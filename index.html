<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COUNTDOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <header>
        <h1>COUNTDOWN</h1>
        <div id="clock">00:00:00</div>
        <div id="today">2026.08.13</div>
    </header>


    <section class="countdown">

        <div class="event">

            <div class="event-name">共通テスト</div>

            <div class="event-date">
                2027.01.17&nbsp;&nbsp;09:30
            </div>

            <div class="remaining">
                <span id="commonDays">000</span>
                <span class="unit">日</span>

                <span id="commonHours">00</span>
                <span class="unit">時間</span>

                <span id="commonMinutes">00</span>
                <span class="unit">分</span>

                <span id="commonSeconds">00</span>
                <span class="unit">秒</span>
            </div>

        </div>


        <div class="line"></div>


        <div class="event">

            <div class="event-name">二次試験</div>

            <div class="event-date">
                2027.02.25
            </div>

            <div class="remaining">
                <span id="secondDays">000</span>
                <span class="unit">日</span>

                <span id="secondHours">00</span>
                <span class="unit">時間</span>

                <span id="secondMinutes">00</span>
                <span class="unit">分</span>

                <span id="secondSeconds">00</span>
                <span class="unit">秒</span>
            </div>

        </div>

    </section>

    <!-- QUOTE -->

    <section class="quote">

    <div class="line"></div>

    <div class="quote-header">
        <h2>QUOTE</h2>
        <span id="quoteDate"></span>
    </div>

    <div class="quote-en" id="quoteEnglish"></div>

    <div class="quote-ja" id="quoteJapanese"></div>

    <div class="quote-author" id="quoteAuthor"></div>

    </section>
    
    <!-- DAILY PROBLEM -->
<section class="problem">
    <div class="line"></div>

    <div class="problem-header">
        <h2>DAILY PROBLEM</h2>
        <span id="problemDate"></span>
    </div>

    <div class="problem-category" id="problemCategory"></div>

    <div class="problem-question" id="problemQuestion"></div>

    <div class="problem-actions">
        <button class="problem-button" id="answerToggle">
            SHOW ANSWER
        </button>

        <button class="problem-button" id="solutionToggle">
            SHOW SOLUTION
        </button>
    </div>

    <div class="problem-answer" id="problemAnswer"></div>
    <div class="problem-solution" id="problemSolution"></div>
</section>

<!-- DIARY -->

    <section class="diary">

        <div class="line"></div>

        <div class="diary-header">
            <h2>DIARY</h2>
            <span id="diaryDate">2026.08.13</span>
        </div>


        <textarea
            id="diaryInput"
            placeholder="今日のことを書く..."
        ></textarea>

        <p class="diary-note">
         ※ 一日一回まで。(上書き保存されます。) 同じ端末では記録が残ります。
        </p>


        <div class="diary-actions">

            <button id="saveDiary">
                SAVE
            </button>

            <span id="saveMessage"></span>

        </div>


        <div class="entries">

            <div class="entries-title">
                ENTRIES
            </div>

            <div id="diaryList"></div>

        </div>

    </section>

</main>

<script src="quotes.js"></script>
<script src="script.js"></script>
<script src="problems.js"></script>

</body>
</html>
