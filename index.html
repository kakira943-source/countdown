<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COUNTDOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <header>
        <h1>COUNTDOWN</h1>
        <div id="clock">00:00:00</div>
        <div id="today">2026.08.13</div>
    </header>


    <section class="countdown">

        <div class="event">
            <div class="event-name">共通テスト</div>

            <div class="event-date">
                2027.01.17&nbsp;&nbsp;09:30
            </div>

            <div class="remaining">
                <span id="commonDays">000</span>
                <span class="unit">日</span>

                <span id="commonHours">00</span>
                <span class="unit">時間</span>

                <span id="commonMinutes">00</span>
                <span class="unit">分</span>

                <span id="commonSeconds">00</span>
                <span class="unit">秒</span>
            </div>
        </div>


        <div class="line"></div>


        <div class="event">

            <div class="event-name">二次試験</div>

            <div class="event-date">
                2027.02.25
            </div>

            <div class="remaining">
                <span id="secondDays">000</span>
                <span class="unit">日</span>

                <span id="secondHours">00</span>
                <span class="unit">時間</span>

                <span id="secondMinutes">00</span>
                <span class="unit">分</span>

                <span id="secondSeconds">00</span>
                <span class="unit">秒</span>
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
